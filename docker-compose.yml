# RTL-SDR Scanner stack. Paste this into Portainer: Stacks > Add stack > Web editor.
# First start: the one-time admin password is in the container log.
# Plug the dongle in BEFORE the container starts.

services:
  rtl-sdr-scanner:
    # Built and published by this repo's GitHub Actions on every release.
    # To build it yourself instead: docker build -t rtl-sdr-scanner . and
    # change this line to image: rtl-sdr-scanner
    image: ghcr.io/nullangst/rtl-sdr-scanner:latest
    container_name: rtl-sdr-scanner
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8073}:8073"
    environment:
      - TZ=${TZ:-America/New_York}
      # Behind NPM, NPMPlus, nginx or Caddy: 1. With Cloudflare in front of that: 2.
      # Leave unset when nothing sits in front, or anyone can fake their IP
      # past the login rate limit.
      # - TRUST_PROXY=1
      # Only needed if your proxy rewrites the Host header.
      # - ALLOWED_ORIGINS=https://radio.example.com
      # - MAX_LISTENERS=25
    volumes:
      - rtl_sdr_data:/data   # config.json: channels, settings, password hash
    # Pass the USB bus through. If the dongle still is not found, comment
    # this out and use privileged instead.
    devices:
      - /dev/bus/usb:/dev/bus/usb
    # privileged: true

volumes:
  rtl_sdr_data:
